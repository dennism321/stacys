name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and IndexNow partners, which feed ChatGPT search and Copilot) that the pages changed.
      # The key below must match public/<key>.txt. Failures here never fail the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 730cdaa26dc855315978b9af25090bcc
        run: |
          sleep 30
          urls=$(curl -s https://stacyesthetics.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -s -o /dev/null -w "IndexNow responded %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"stacyesthetics.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://stacyesthetics.com/$INDEXNOW_KEY.txt\",\"urlList\":$urls}"
