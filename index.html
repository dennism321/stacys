<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Stacy's Esthetics | Head Spa, Facials &amp; Massage in Prospect, CT</title>
    <meta name="description" content="Japanese-style head spa, facials, massage, and body contouring at Stacy's Esthetics in Prospect, CT. Unhurried, thoughtful care. Book online today." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- If the domain changes, update the canonical, og:url, og:image, and JSON-LD urls (and SITE_URL in src/paths.ts). -->
    <link rel="canonical" href="https://stacyesthetics.com/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stacy's Esthetics" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://stacyesthetics.com/" />
    <meta property="og:title" content="Stacy's Esthetics | Head Spa, Facials &amp; Massage in Prospect, CT" />
    <meta property="og:description" content="Japanese-style head spa water rituals, facials, massage, and body contouring in Prospect, CT. Fall in love with yourself." />
    <meta property="og:image" content="https://stacyesthetics.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Stacy's Esthetics logo beside a head spa water ritual" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stacy's Esthetics | Head Spa, Facials &amp; Massage in Prospect, CT" />
    <meta name="twitter:description" content="Japanese-style head spa water rituals, facials, massage, and body contouring in Prospect, CT." />
    <meta name="twitter:image" content="https://stacyesthetics.com/og-image.jpg" />

    <!-- Keep the address, phone, and hours in sync with `studio` in src/data.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Stacy's Esthetics",
        "slogan": "Fall in love with yourself",
        "description": "Japanese-style head spa water rituals, facials, massage, body contouring, post-op recovery, laser hair removal, and waxing.",
        "url": "https://stacyesthetics.com/",
        "logo": "https://stacyesthetics.com/images/logo-mark-dark.webp",
        "image": "https://stacyesthetics.com/og-image.jpg",
        "telephone": "+1-914-310-4680",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "26 Union City Rd.",
          "addressLocality": "Prospect",
          "addressRegion": "CT",
          "postalCode": "06712",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:30", "closes": "18:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:30", "closes": "16:00" }
        ],
        "geo": { "@type": "GeoCoordinates", "latitude": 41.5047897, "longitude": -72.9837645 },
        "hasMap": "https://maps.google.com/?cid=1480761830549486181",
        "priceRange": "$$",
        "areaServed": "Prospect, CT",
        "sameAs": [
          "https://www.instagram.com/stacysesthetics/",
          "https://www.tiktok.com/@wsteysi"
        ],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Head spa" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Facials and microneedling" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Massage therapy" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Body contouring" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Post-op lymphatic drainage" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Laser hair removal" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Waxing" } }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the fonts without blocking the first paint; text shows in a fallback font for a moment. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;450;500;550;600&family=Great+Vibes&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;450;500;550;600&family=Great+Vibes&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;450;500;550;600&family=Great+Vibes&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
